stages:
  ingest:
    cmd: uv run python -m src.rag.ingestion --input data/raw/Law.pdf --output data/processed/civil_code.json
    deps:
      - data/raw/Law.pdf
      - src/rag/ingestion.py
    outs:
      - data/processed/civil_code.json

  clean:
    cmd: uv run python -m src.rag.clean_dataset
    deps:
      - data/processed/civil_code.json
    outs:
      - data/processed/civil_code_ready.json

  chunk:
    cmd: uv run python -m src.rag.chunking
    deps:
      - data/processed/civil_code_ready.json
    outs:
      - data/processed/civil_code_chunks.json

  index:
    cmd: uv run python -c "from src.rag.retrieval import LegalRetriever; LegalRetriever()"
    deps:
      - data/processed/civil_code_chunks.json
      - src/rag/embeddings.py
      - src/rag/retrieval.py
    outs:
      - data/processed/index_store/vectors.npy
