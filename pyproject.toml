[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egyptian-legal-rag"
version = "0.1.0"
description = "Production-ready bilingual Legal RAG for the Egyptian Civil Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "ragas>=0.1.0",
    "datasets>=2.16.0",
    "pydantic-settings>=2.2.0",
    "dvc>=3.48.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.23.0",
    "mlflow>=2.10.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

[project.scripts]
mlflow-ui = "src.rag.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "pre-commit>=3.5.0",
]

[tool.pytest.ini_options]
addopts = "-v --cov=src --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/rag/experiments.py",
    "src/rag/server.py",
    "src/rag/clean_dataset.py",
    "src/rag/ingestion.py",
    "src/rag/config.py",
    "src/rag/embeddings.py",
    "src/rag/evaluation.py",
    "src/rag/guardrails.py",
    "src/rag/retrieval.py",
]

[tool.setuptools.packages.find]
where = ["."]
